---
- name: Test Github org repo
  module_defaults:
    opentelekomcloud.gitcontrol.github_org_repository:
      token: "{{ token }}"
      owner: "{{ test_org }}"

  block:
    - name: Check mode
      check_mode: true
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        description: "Test description"
        homepage: "https://test.com"
        archived: false
        has_issues: false
        has_projects: false
        has_wiki: false
        visibility: public
        is_template: false
        auto_init: false
        gitignore_template: false
        license_template: false
        allow_squash_merge: true
        allow_merge_commit: true
        allow_rebase_merge: true
        allow_auto_merge: true
        delete_branch_on_merge: true
        default_branch: main
        topics: ['a', 'b']
        teams:
          - slug: team_a
            permission: admin
        collaborators:
          - username: fake_user
            permission: pull
        branch_protections: "{{ test_branch_protections }}"

    - name: Create repository with auto init and templates
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        description: "Test description"
        homepage: "https://test.com"
        archived: false
        has_issues: false
        has_projects: false
        has_wiki: false
        visibility: public
        is_template: false
        auto_init: true
        gitignore_template: "Python"
        license_template: "mit"
        allow_squash_merge: true
        allow_merge_commit: true
        allow_rebase_merge: true
        allow_auto_merge: true
        delete_branch_on_merge: true
        default_branch: main
        topics: ['a', 'b']
        teams:
          - slug: team_c
            permission: push
        collaborators:
          - username: g2tema
            permission: pull
        branch_protections: "{{ test_branch_protections }}"

    - name: Apply - another iteration
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        description: "Test description"
        homepage: "https://test.com"
        archived: false
        has_issues: false
        has_projects: false
        has_wiki: false
        visibility: public
        is_template: false
        auto_init: true
        gitignore_template: "Python"
        license_template: "mit"
        allow_squash_merge: true
        allow_merge_commit: true
        allow_rebase_merge: true
        allow_auto_merge: true
        delete_branch_on_merge: true
        default_branch: main
        topics: ['a', 'b']
        teams:
          - slug: team_c
            permission: push
        collaborators: []
        branch_protections: "{{ test_branch_protections }}"

    - name: Drop repository
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        state: absent

    - name: Create repository with auto init and no templates
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        description: "Test description"
        homepage: "https://test.com"
        archived: false
        has_issues: false
        has_projects: false
        has_wiki: false
        visibility: public
        is_template: false
        auto_init: true
        allow_squash_merge: true
        allow_merge_commit: true
        allow_rebase_merge: true
        allow_auto_merge: true
        delete_branch_on_merge: true
        default_branch: main
        topics: ['a', 'b']
        teams:
          - slug: team_c
            permission: push
        collaborators:
          - username: g2tema
            permission: pull
        branch_protections: "{{ test_branch_protections }}"

    - name: Update repository branch protections with "null" restrictions
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        description: "Test description"
        homepage: "https://test.com"
        archived: false
        has_issues: false
        has_projects: false
        has_wiki: false
        visibility: public
        is_template: false
        auto_init: true
        allow_squash_merge: true
        allow_merge_commit: true
        allow_rebase_merge: true
        allow_auto_merge: true
        delete_branch_on_merge: true
        default_branch: main
        topics: ['a', 'b']
        teams:
          - slug: team_c
            permission: push
        collaborators:
          - username: g2tema
            permission: pull
        branch_protections:
          - branch: main
            restrictions:
            required_status_checks:
              strict: true
              checks:
                - context: context_app
                  app_id: 152782
            enforce_admins: true
            required_pull_request_reviews:
              dismissal_restrictions:
                users: []
                teams: []
              dismiss_stale_reviews: true
              require_code_owner_reviews: true
              required_approving_review_count: 2

    - name: Drop repository
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test2
        state: absent

    # Regression: unmanaged attributes must not be reverted to a default.
    # Callers pass `private: "{{ repo.private | default(omit) }}"`, and an
    # argument_spec default would reach the API as an explicit value and
    # flip a private repository public.
    - name: Create private repository
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test_private
        description: "Private repo"
        private: true

    - name: Apply without private/visibility/topics
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test_private
        description: "Private repo"
      register: unmanaged_apply

    - name: Repository must still be private and unchanged
      assert:
        that:
          - unmanaged_apply.repository.private
          - not unmanaged_apply.changed
        fail_msg: >-
          Omitted attributes were applied as defaults:
          private={{ unmanaged_apply.repository.private }},
          changed={{ unmanaged_apply.changed }}

    - name: Drop private repository
      opentelekomcloud.gitcontrol.github_org_repository:
        name: test_private
        state: absent